include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - use_key_in_widget_constructors
    - prefer_const_constructors
    - avoid_print
    - use_full_hex_values_for_flutter_colors

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - android/**
    - windows/**
  # YAGNI: custom lint for EdgeInsetsDirectional + Semantics enforced via code review
  # Require: EdgeInsetsDirectional not EdgeInsets.only, Semantics on icon-only
  # See SPEC.md:Code Style + scaffold.md

# Hallmark token discipline: no inline oklch() outside :root
