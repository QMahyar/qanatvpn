name: build-android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install sagernet gomobile
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK + NDK 28
        # ubuntu-latest ships cmdline-tools but not sdkmanager on PATH —
        # probed live (exit 127). android-actions/setup-android wires the
        # preinstalled SDK into the environment; sdkmanager then installs
        # the pinned NDK/platform.
        uses: android-actions/setup-android@v3

      - name: Install pinned NDK + platform
        run: |
          sdkmanager --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build libbox.aar (with_awg)
        run: make -C . lib_android

      - name: Sanity — amneziawg symbols present, stub absent
        run: |
          cd android/app/libs
          mkdir -p extracted && cd extracted
          unzip -o ../libbox.aar 'jni/arm64-v8a/*' >/dev/null
          strings jni/arm64-v8a/libbox.so | grep -q amneziawg || { echo "AWG missing — with_awg tag?"; exit 1; }
          if strings jni/arm64-v8a/libbox.so | grep -q "Awg is not included"; then echo "AWG stub shipped"; exit 1; fi

      - name: Flutter test + analyze
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze
          flutter test

      - name: Setup signing (if secrets present)
        # `secrets` context is banned in step-if (workflow parse fails at
        # dispatch — probed on the first real push); env indirection is the
        # documented pattern.
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APKs (split per ABI)
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons --dart-define=UPDATE_CHANNEL=androidApk

      - name: APK size gate (libbox.aar dominates — fail before release)
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            if [ "$size" -gt 125829120 ]; then
              echo "APK $f over 120MB budget — investigate libbox bloat" >&2
              exit 1
            fi
          done

      - name: Rename artifacts + sha256
        run: |
          V="${GITHUB_REF_NAME#v}"
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            name="yourvpn_v${V}_${abi}.apk"
            cp "app-$abi-release.apk" "$name"
            # Sibling .sha256 per asset: the in-app installer probes this
            # exact URL and fails closed when absent/mismatched (audit W1.5).
            sha256sum "$name" | awk '{print $1"  "$2}' > "$name.sha256"
          done

      - name: Release android assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/yourvpn_*.apk
            build/app/outputs/flutter-apk/yourvpn_*.apk.sha256
          generate_release_notes: true

  # Single producer of latest.json: waits until BOTH platform jobs have
  # attached their assets, then builds the merged platform map from the
  # release's real asset list. The parallel windows job writes only its own
  # artifacts, so no two writers can race the file.
  metadata:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - name: Wait for windows asset, then generate + attach latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # Dispatch runs have no tag: skip entirely (latest.json is a
        # release-time artifact, single producer on v* pushes).
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2400))
          until gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[].name' | grep -q 'windows-x64.zip'; do
            if [ $SECONDS -ge $deadline ]; then
              echo "windows asset never appeared; proceeding with android-only map" >&2
              break
            fi
            sleep 60
          done
          python3 - <<'PY'
          import json, os, subprocess
          repo, tag = os.environ['REPO'], os.environ['TAG']
          doc = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{repo}/releases/tags/{tag}']))
          assets = {a['name']: a['browser_download_url'] for a in doc['assets']}
          filters = {
              'android-arm64': ['arm64-v8a', '.apk'],
              'android-arm': ['armeabi-v7a', '.apk'],
              'android-x64': ['x86_64', '.apk'],
              'windows-x64': ['windows-x64', '.zip'],
          }
          import urllib.request, urllib.error
          def sha_for(asset_name, asset_url):
              # Sibling .sha256 files (android job) or repo-side sha256-windows.json.
              try:
                  with urllib.request.urlopen(asset_url + '.sha256', timeout=30) as r:
                      first = r.read(512).decode('utf-8', 'replace').split()[0]
                      if len(first) == 64:
                          return first
              except Exception:
                  pass
              return None
          platforms = {}
          for key, needles in filters.items():
              for name, url in assets.items():
                  if all(n in name for n in needles):
                      platforms[key] = {'url': url, 'version': tag, 'sha256': sha_for(name, url)}
                      break
          json.dump({'version': tag, 'platforms': platforms},
                    open('latest.json', 'w'), indent=2)
          PY
          gh release upload "$TAG" latest.json --clobber
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[].name' | grep -q latest.json
