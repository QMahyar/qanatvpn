name: build-windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build sing-box.exe (with_awg, CGO off)
        working-directory: go/amnezia-box
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $version = git describe --tags
          $ldflags = "-X github.com/sagernet/sing-box/constant.Version=$version -X runtime.godebugDefault=multipathtcp=0,tlssha1=1,tlsunsafeekm=1 -checklinkname=0 -s -w -buildid="
          $tags = "with_gvisor,with_quic,with_wireguard,with_utls,with_naive_outbound,with_clash_api,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0,with_tailscale,ts_omit_logtail,ts_omit_ssh,ts_omit_drive,ts_omit_taildrop,ts_omit_webclient,ts_omit_doctor,ts_omit_capture,ts_omit_kube,ts_omit_aws,ts_omit_synology,ts_omit_bird,with_awg,with_purego"
          go build -trimpath -buildvcs=false -ldflags "$ldflags" -tags "$tags" -o ../../windows/sing-box.exe ./cmd/sing-box
          if (-not (Test-Path ../../windows/sing-box.exe)) { throw "sing-box.exe missing" }
          $env:PATH = "$PWD\..\..\windows;$env:PATH"
          sing-box version | Select-String awg

      - name: Flutter test + analyze
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze
          flutter test

      - name: Build Windows app
        run: flutter build windows --release

      - name: Bundle zip
        # Dispatch runs have no GITHUB_REF_NAME — fall back to the run's
        # commit short SHA so the artifact name stays unique per build.
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          # Dispatch: no tag name — use short SHA. Tag push: strip the v.
          if ($env:REF_NAME -match '^v') { $v = $env:REF_NAME.TrimStart('v') }
          else { $v = $env:SHORT_SHA.Substring(0, 7) }
          $dir = "build/windows/x64/runner/Release"
          Copy-Item windows/sing-box.exe "$dir/sing-box.exe"
          Compress-Archive -Path "$dir/*" -DestinationPath "qanatvpn_v${v}_windows-x64.zip"
          $hash = (Get-FileHash "qanatvpn_v${v}_windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          @{ "qanatvpn_v${v}_windows-x64.zip" = $hash } | ConvertTo-Json | Set-Content sha256-windows.json
          # Sibling .sha256 the in-app installer probes (audit W1.5)
          "$hash  qanatvpn_v${v}_windows-x64.zip" | Set-Content "qanatvpn_v${v}_windows-x64.zip.sha256"

      - name: Release windows asset
        # Dispatch runs have no tag: upload as a run artifact instead of a
        # release asset. Tag pushes (v*) publish to the release proper.
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            qanatvpn_v*_windows-x64.zip
            qanatvpn_v*_windows-x64.zip.sha256
            sha256-windows.json
          generate_release_notes: true

      - name: Upload windows zip as run artifact (dispatch builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-zip
          path: |
            qanatvpn_v*_windows-x64.zip
            qanatvpn_v*_windows-x64.zip.sha256
            sha256-windows.json
          retention-days: 14
        # latest.json is produced by build-android's metadata job (single
        # producer) after this asset lands, so no second writer races it.
