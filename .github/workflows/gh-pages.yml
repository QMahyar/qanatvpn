name: gh-pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to mirror latest.json from (defaults to the triggering ref)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        env:
          GH_TOKEN: ${{ github.token }}
          # Tag push: the tag itself. Master dispatch: pass the release tag
          # via the input (the github-pages environment protection rules
          # reject tag-name refs — probe v0.1.1).
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p site
          cp docs/site/index.html site/
          # Mirror latest.json straight from the release the metadata job
          # attached (single producer: build-android metadata job).
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'latest.json' --output site/latest.json || \
            echo "latest.json not on release yet — site ships without it"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
