name: qanatvpn
description: QANATVPN — Flutter+Go VPN (All Protocols, WG+AWG priority first)
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ">=3.12.0 <4.0.0"
  # Flutter 3.44+ required: material_3_expressive 1.x (45 M3E) + flutter_foreground_task 11.x
  # Installed/latest stable: 3.47.2. Android min SDK = 24 (Android 7) — supported via minSdkVersion.
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  material_3_expressive: ^1.1.1 # full 45 M3E widget set (Slipnet-faithful), requires Flutter >=3.44
  material_ui: ^1.1.0 # decoupled Material library that material_3_expressive 1.x needs
  cue: ^0.3.1 # physics-first animations (latest is 0.3.1; ^1.0.0 does not exist)
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.0.0
  http: ^1.6.0
  flutter_cache_manager: ^3.4.2
  workmanager: ^0.10.9
  package_info_plus: ^10.2.1
  fl_chart: ^1.2.0
  flutter_foreground_task: ^11.0.1 # requires Flutter >=3.44 / Dart >=3.12, Kotlin 2.2.20+, Gradle 8.11.1+
  yaml: ^3.1.4
  cryptography: ^2.9.0
  file_picker: ^12.2.0
  path_provider: ^2.1.5 # store path resolution (audit W1.4: env chain unset on Android)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  path: ^1.9.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - profiles/config.wg-awg.json
    - rule_sets/initial_assets/
